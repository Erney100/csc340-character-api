<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Character Gallery</title>
</head>

<body>

    <header>
        <h1>My Character Gallery</h1>
        <p>Welcome to my cute character collection!</p>
    </header>



    <main>

        <h2>Character Gallery</h2>

        <div class="search-box">
            <input type="text" id="searchName" placeholder="Search by character name">

            <input type="text" id="searchUniverse" placeholder="Filter by universe">

            <button type="button" id="searchButton">
                Search
            </button>
        </div>

        <p id="successMessage" role="status"></p>
        <p id="status" role="status">Loading characters...</p>

        <div class="character-gallery" id="gallery"></div>

    </main>

    <footer>
        <p>My Character Gallery &copy; 2026</p>
    </footer>

    <script src="/js/nav.js" defer></script>
    <script type="module" src="/js/gallery.js"></script>

</body>

</html>
