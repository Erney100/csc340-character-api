<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Add a Character</title>
</head>

<body>

    <header>
        <h1>Add a Character</h1>
        <p>Add a new character to the gallery!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="details.html">Details</a>
        <a href="about.html">About</a>
        <a href="new-character-form.html">Add a Character</a>
    </nav>

    <main>

        <section class="form-card">

            <h2>Character Information</h2>

            <form>

                <label for="name">Character Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter character name"
                >


                <label for="universe">Universe</label>

                <input
                    type="text"
                    id="universe"
                    name="universe"
                    placeholder="Enter universe"
                >


                <label for="role">Role</label>

                <input
                    type="text"
                    id="role"
                    name="role"
                    placeholder="Enter character role"
                >


                <label for="image">Image URL</label>

                <input
                    type="url"
                    id="image"
                    name="image"
                    placeholder="Enter image URL"
                >


                <label for="description">Short Description</label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Enter a short character description"
                ></textarea>


                <button type="submit">Add Character</button>

            </form>

        </section>

    </main>

    <footer>
        <p>My Character Gallery &copy; 2026</p>
    </footer>
<script src="/js/nav.js" defer></script>
</body>

</html>
