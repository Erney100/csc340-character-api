<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Add a Character</title>
</head>

<body>

    <header>
        <h1>Add a Character</h1>
        <p>Add a new character to the gallery!</p>
    </header>

    <main>

        <section class="form-card">

            <h2>Character Information</h2>
            <p id="formMessage"></p>

            <form id="characterForm">

                <label for="name">Character Name</label>

                <input type="text" id="name" name="name" placeholder="Enter character name" required>


                <label for="universe">Universe</label>

                <input type="text" id="universe" name="universe" placeholder="Enter universe" required>


                <label for="role">Role</label>

                <input type="text" id="role" name="role" placeholder="Enter character role" required>

                <label for="species">Species</label>
                <input type="text" id="species" name="species" placeholder="Enter character species" required>


                <label for="image">Image URL</label>

                <input type="text" id="image" name="image" placeholder="/images/character.gif" required>


                <label for="description">Short Description</label>

                <textarea id="description" name="description" rows="5" placeholder="Enter a short character description"
                    required></textarea>


                <button type="submit" id="submitButton">Add Character</button>

            </form>

        </section>

    </main>

    <footer>
        <p>My Character Gallery &copy; 2026</p>
    </footer>
    <script src="/js/nav.js" defer></script>
    <script type="module" src="/js/form.js"></script>
</body>

</html>
