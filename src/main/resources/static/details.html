<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Character Details</title>
</head>

<body>

    <header>
        <h1>Character Details</h1>
        <p>Learn more about my favorite characters!</p>
    </header>



    <main>

        <p id="message"></p>
        <p id="status">Loading character...</p>

        <section class="details-card" id="detailsCard" hidden>

            <img id="characterImage" src="images/placeholder.png"
                 alt="Character image">

            <div class="details-text">

                <h2 id="characterName"></h2>

                <p id="characterDescription"></p>

                <h3>Character Information</h3>

                <p><strong>Universe:</strong>
                    <span id="characterUniverse"></span>
                </p>

                <p><strong>Species:</strong>
                    <span id="characterSpecies"></span>
                </p>

                <p><strong>Role:</strong>
                    <span id="characterRole"></span>
                </p>

                <a href="index.html">Back to Gallery</a>

                <div class="character-actions">
                    <a id="editButton" href="#">Edit Character</a>
                    <button id="deleteButton">Delete Character</button>
                </div>

            </div>

        </section>

    </main>

    </main>

    <footer>
        <p>My Character Gallery &copy; 2026</p>
    </footer>


<script src="/js/nav.js" defer></script>
<script type="module" src="/js/details.js"></script>

</body>

</html>
